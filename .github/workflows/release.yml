# Release CI for the `embarch-topology` binary (CLI + local web UI,
# design.md §3 decision 5) — mirrors embarch-core's own release.yml exactly
# (same probe-rs/serialport dependency shape under `--features bin`, same
# four targets), since this repo has no cross-repo path dependency of its
# own to worry about (unlike embarch-core/embarch-api/embarch-umbrella's
# release workflows, which now check out this repo as a sibling — see their
# own release.yml comments).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch-topology

permissions:
  contents: write

jobs:
  # embarch-umbrella decisions 27/29: no release may build a binary whose
  # `--version` disagrees with the tag that produced it. This job gates the
  # build matrix, so a mismatch costs one ubuntu runner-minute rather than
  # four cross-compiles and an uploaded asset — the decision's "failing the
  # release outright" rather than catching it afterwards. `doctor` check 1
  # compares installed binaries against the suite manifest and therefore
  # inherits this gap; it can only detect a mismatch that already got
  # shipped.
  #
  # Toolchain-free by choice, and identical to the job the other three
  # release workflows carry: this repo has no sibling path dependency, but
  # the check is only worth having if it is the same check everywhere.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml version must match the pushed tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref $GITHUB_REF_NAME is not a tag (workflow_dispatch); nothing to compare"
            exit 0
          fi
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $version matches tag $GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install libudev (native Linux build only)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --features bin --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --features bin --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
