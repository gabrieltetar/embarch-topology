# Release CI for the `embarch-topology` binary (CLI; its local web UI half
# is retired, decision 5) — mirrors embarch-core's own release.yml exactly
# (same probe-rs/serialport dependency shape under `--features bin`, same
# four targets), since this repo has no cross-repo path dependency of its
# own to worry about (unlike embarch-core/embarch-api/embarch-umbrella's
# release workflows, which now check out this repo as a sibling — see their
# own release.yml comments).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch-topology

permissions:
  contents: write

jobs:
  # embarch-umbrella decisions 27/29: no release may build a binary whose
  # `--version` disagrees with the tag that produced it. This job gates the
  # build matrix, so a mismatch costs one ubuntu runner-minute rather than
  # four cross-compiles and an uploaded asset — the decision's "failing the
  # release outright" rather than catching it afterwards. `doctor` check 1
  # compares installed binaries against the suite manifest and therefore
  # inherits this gap; it can only detect a mismatch that already got
  # shipped.
  #
  # Toolchain-free by choice, and identical to the job the other three
  # release workflows carry: this repo has no sibling path dependency, but
  # the check is only worth having if it is the same check everywhere.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml version must match the pushed tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref $GITHUB_REF_NAME is not a tag (workflow_dispatch); nothing to compare"
            exit 0
          fi
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $version matches tag $GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install libudev (native Linux build only)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --features bin --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --features bin --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # The matrix only builds. It holds no `id-token` and publishes nothing:
      # the one `sign` job below signs and publishes, so a release costs one
      # approval of the `release` environment and the build jobs never see
      # an OIDC token.
      - name: Upload archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # Signs every archive keylessly and publishes asset and bundle together.
  # It must stay in this file, not a reusable workflow: the certificate's
  # identity is this workflow at the tag,
  #   https://github.com/gabrieltetar/embarch-topology/.github/workflows/release.yml@refs/tags/<tag>
  # and a called workflow would put its own name there instead.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.0.4

      - name: Sign every archive
        shell: bash
        run: |
          set -euo pipefail
          cosign version
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "::error::expected 4 archives, found ${#assets[@]}"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done
          ls -l dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sigstore.json
          fail_on_unmatched_files: true
