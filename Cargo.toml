[package]
name = "embarch-topology"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The EmbArch suite's shared software- and hardware-topology crate: resolve_software_topology()/resolve_dev_bench_port()/enrollment/validate(), linked live by embarch-core, embarch-api, and embarch-umbrella, plus a thin CLI binary over the same functions. embarch-doc/embarch-topology/design.md is the source of truth."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The `embarch-topology` binary (CLI, design.md §3 decision 5 — its local web
# UI half retired 2026-08-24, embarch-ui/milestone-1.md §4.9) is a `[[bin]]`
# target in this same package rather than a separate crate — same shape as
# embarch-study-designer's `extract-gatt-config` tool (design.md §5's
# cross-repo-dependency precedent this repo follows). Gated behind the `bin`
# feature so a plain library consumer (embarch-core with
# `default-features = false, features = ["hardware"]`, embarch-api/
# embarch-umbrella with default features) never resolves or builds clap.
[[bin]]
name = "embarch-topology"
path = "bin/main.rs"
required-features = ["bin"]

[dependencies]
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }

# ---- feature-gated under `software` (on by default: embarch-api/
# embarch-umbrella both need it, embarch-core never calls into this module at
# all — confirmed via grep, only `embarch_topology::hardware::*`). Split out
# from `hardware` deliberately, found worth doing once `cargo tree` showed
# `reqwest` pulls in `aws-lc-sys` (rustls's default crypto provider) even
# under just `features = ["hardware"]`: a real C-toolchain-needing dependency
# `embarch-core`'s own Windows build has no use for and shouldn't pay for
# cross-compiling (`embarch-dev-workflow.md` §4's own MSVC-linker caveat is
# exactly this class of risk). `embarch-core`'s Cargo.toml opts out with
# `default-features = false, features = ["hardware"]`.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"], optional = true }
# `rt`/`macros`/`sync`/`time` cover `resolve_software_topology()`'s async fn.
# Nothing under `hardware` alone needs tokio at all (`alert.rs`'s loopback
# push is a raw, sync `std::net::TcpStream`, deliberately — see that file's
# own doc comment). The `bin` feature no longer needs anything heavier than
# this since its own web-server half was retired (2026-08-24) — `Status`,
# its one async subcommand, runs on a plain `new_current_thread` runtime.
tokio = { version = "1.53.0", features = ["rt", "macros", "sync", "time"], optional = true }

# ---- feature-gated under `hardware` (embarch-core is the one consumer) or
# `bin` (this crate's own CLI/UI binary) — never by embarch-api/
# embarch-umbrella, which stay hardware-free in their own dependency
# footprint by design (embarch-umbrella/Cargo.toml's own "deliberately
# absent" comment; design.md §5's public-API open question, resolved here:
# feature-gate the hardware half rather than force it on every consumer).
probe-rs = { version = "0.31", optional = true }
serialport = { version = "4.9.0", features = ["usbportinfo-interface"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
toml = { version = "1.1", optional = true }
# The alert log (`hardware::alert`) is JSON-lines, and the same alert type
# is what a live push's tiny loopback POST body carries — both need this
# under `hardware` already, not just under `bin`.
serde_json = { version = "1.0.150", optional = true }

# ---- feature-gated: only pulled in by this crate's own `bin` target.
clap = { version = "4.6.2", features = ["derive"], optional = true }

[features]
# `software` on by default: the common case (embarch-api/embarch-umbrella)
# needs it and neither wants `hardware`, so defaulting it on and having
# embarch-core opt out (the one consumer that doesn't need it) is fewer
# Cargo.toml edits across the suite than defaulting it off.
default = ["software"]
# Software-topology detection + Core-reachability probing
# (`resolve_software_topology`) — needs `reqwest`/`tokio`.
software = ["dep:reqwest", "dep:tokio"]
# Hardware-topology detection/enrollment/validation (dev-bench port
# detection, chip hardware-ID readback, enrollment storage, validate()) —
# needs probe-rs/serialport, so it's opt-in. embarch-core is the one
# consumer that enables it.
hardware = ["dep:probe-rs", "dep:serialport", "dep:serde", "dep:toml", "dep:serde_json"]
# This crate's own CLI binary. Implies both halves (the whole point of the
# binary is to run the identical validation/enrollment logic Core runs,
# design.md §3 decision 8, plus report software topology like `doctor`
# does). Used to also imply a local web server's dependencies — retired
# 2026-08-24 (embarch-ui/milestone-1.md §4.9) along with `bin/ui.rs` itself.
bin = ["hardware", "software", "dep:clap", "dep:tracing-subscriber"]

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
